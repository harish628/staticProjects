apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
  - pdb.yaml
images:
  - name: 430398381271.dkr.ecr.ap-southeast-2.amazonaws.com/statichtmlpages
    newTag: v1                       # change per release (never use :latest)
patches:
  - target:
      kind: Deployment
      name: html-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
