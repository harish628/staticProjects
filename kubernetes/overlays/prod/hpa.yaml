# Needs metrics-server installed in the cluster
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: html-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: html-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
