apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/html-app
    newName: 430398381271.dkr.ecr.ap-southeast-2.amazonaws.com/statichtmlpages  # <- your real ECR URI
    newTag: v1     # change per release (never use :latest)
replicas:
  - name: html-app
    count: 5
