apiVersion: v1
kind: Service
metadata:
  name: html-app
  labels:
    app.kubernetes.io/name: html-app
  annotations:
    # Creates a Network Load Balancer (instead of the older Classic LB)
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: html-app
  ports:
    - name: http
      port: 80
      targetPort: http
