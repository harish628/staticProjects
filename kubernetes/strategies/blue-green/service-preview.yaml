# PREVIEW service: always points to green, for testing before the switch.
# ClusterIP (free). Test with: kubectl port-forward svc/html-app-preview 8080:80
apiVersion: v1
kind: Service
metadata:
  name: html-app-preview
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: html-app
    version: green
  ports:
    - name: http
      port: 80
      targetPort: http
