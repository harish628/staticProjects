# LIVE service: users hit this. Switch traffic by changing "version" below.
apiVersion: v1
kind: Service
metadata:
  name: html-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: html-app
    version: green                   # <- the switch
  ports:
    - name: http
      port: 80
      targetPort: http
