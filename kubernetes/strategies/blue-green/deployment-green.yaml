apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-app-green
  labels:
    app.kubernetes.io/name: html-app
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: html-app
      version: green                    # version label keeps blue/green pods separate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: html-app
        version: green
    spec:
      containers:
        - name: html-app
          image: 430398381271.dkr.ecr.ap-southeast-2.amazonaws.com/statichtmlpages:imbus-v1
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
